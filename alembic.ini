# Alembic Config for AI BDM
#
# The actual database URL is NOT set here — env.py imports it from
# app.database.db so we honor the same DATABASE_URL / cloud-detection
# logic the runtime uses. Do not put credentials in this file.
#
# CLI usage (from repo root):
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic current
#   alembic history --verbose

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally left BLANK — env.py sets it programmatically.
sqlalchemy.url =

[post_write_hooks]
# empty by default

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
